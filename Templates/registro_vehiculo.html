<!DOCTYPE html>
<html>
<head>
    <title>Registro de Vehículo</title>
</head>
<body>
    <h1>Dar de Alta un Vehículo</h1>
    <form method="POST">
        <label>Patente: </label>
        <input type="text" name="patente" placeholder="ABC 123" required><br><br>
        
        <label>Tipo de Vehículo: </label>
        <select name="tipo">
            <option value="Auto">Auto</option>
            <option value="Moto">Moto</option>
            <option value="Camioneta">Camioneta</option>
        </select><br><br>
        
        <label>ID del Dueño (Usuario): </label>
        <input type="number" name="usuario_id" placeholder="Ej: 1" required><br><br>
        
        <button type="submit">Guardar Vehículo</button>
    </form>
</body>
</html>
