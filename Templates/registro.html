<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Estacionamiento</title>
</head>
<body>
    <h1>Registro de Usuario</h1>
    <form action="/registro" method="POST">

    </form>
</body>
</html>
